services:
  portainer:
    image: portainer/portainer-ee:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-9443}:9443"
      - "${PORTAINER_PORT2:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      freeradius_network:
        ipv4_address: ${PORTAINER_CT_ADDRESS}

  postgres:
    image: postgres:trixie
    build:
      context: .
      dockerfile: dockerfile.postgres
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER_DEFAULT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEFAULT}
      POSTGRES_DB: ${POSTGRES_DB}
      RADIUS_DB_USER: ${FRD_USER}
      RADIUS_DB_PASSWORD: ${FRD_PASSWORD}
      RADIUS_DB_NAME: ${FRD_NAME_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      freeradius_network:
        ipv4_address: ${POSTGRES_CT_ADDRESS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freeradius"]
      interval: 5s
      timeout: 5s
      retries: 5

  freeradius:
    image: freeradius/freeradius-server:latest-alpine
    build:
      context: .
      dockerfile: dockerfile.freeradius
    container_name: freeradius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      DB_HOST: ${FRD_HOST_DB}
      DB_USER: ${FRD_USER}
      DB_PASSWORD: ${FRD_PASSWORD}
      DB_NAME: ${FRD_NAME_DB}
      DB_PORT: ${FRD_PORT_DB}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      freeradius_network:
        ipv4_address: ${FRD_CT_ADDRESS}
    volumes:
      - freeradius_data:/var/log/freeradius/

volumes:
  postgres_data:
  freeradius_data:

networks:
  freeradius_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DCK_NETWORK}
          gateway: ${DCK_GATEWAY}