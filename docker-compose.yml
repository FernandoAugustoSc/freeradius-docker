services:
  postgres:
    image: postgres:18
    build:
      context: .
      dockerfile: dockerfile.postgres
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER_DEFAULT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEFAULT}
      POSTGRES_DATABASE: ${DATABASE}
      RADIUS_DATABASE_USER: ${FREERADIUS_USER_DEFAULT}
      RADIUS_DATABASE_PASSWORD: ${FREERADIUS_PASSWORD_DEFAULT}
      TZ: ${TZ}
    networks:
      freeradius_network:
        ipv4_address: ${POSTGRES_ADDRESS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DATABASE}"]
      interval: 3s
      timeout: 15s
      retries: 3
  freeradius:
    image: freeradius/freeradius-server:latest
    build:
      context: .
      dockerfile: dockerfile.freeradius
    container_name: freeradius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      DB_HOST: ${POSTGRES_ADDRESS}
      DB_USER: ${FREERADIUS_USER_DEFAULT}
      DB_PASSWORD: ${FREERADIUS_PASSWORD_DEFAULT}
      DB_NAME: ${DATABASE}
      DB_PORT: ${POSTGRES_PORT}
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      freeradius_network:
        ipv4_address: ${FREERADIUS_ADDRESS}
    healthcheck:
      test: ["CMD-SHELL", "freeradius -C"]
      interval: 3s
      timeout: 15s
      retries: 3
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-8.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: ${POSTGRES_ADDRESS}
      POSTGRES_USER: ${POSTGRES_USER_DEFAULT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEFAULT}
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      freeradius_network:
        ipv4_address: ${ZABBIX_SERVER_ADDRESS}
    healthcheck:
      test: ["CMD-SHELL", "zabbix_server -V"]
      interval: 10s
      timeout: 60s
      retries: 3
      start_period: 30s
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-8.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    ports:
      - "${ZABBIX_WEB_PORT:-8080}:8080"
    environment:
      DB_SERVER_HOST: ${POSTGRES_ADDRESS}
      POSTGRES_USER: ${POSTGRES_USER_DEFAULT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEFAULT}
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_ADDRESS}
      PHP_TZ: ${TZ}
    networks:
      freeradius_network:
        ipv4_address: ${ZABBIX_WEB_ADDRESS}
    depends_on:
      zabbix-server:
        condition: service_healthy
  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-8.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_ADDRESS}
      ZBX_HOSTNAME: zabbix-agent
    networks:
      freeradius_network:
        ipv4_address: ${ZABBIX_AGENT_ADDRESS}
    depends_on:
      zabbix-server:
        condition: service_healthy

  portainer:
    image: portainer/portainer-ee:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-9443}:9443"
      - "${PORTAINER_PORT2:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      freeradius_network:
        ipv4_address: ${PORTAINER_ADDRESS}
    depends_on:
      freeradius:
        condition: service_healthy

networks:
  freeradius_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${FREERADIUS_NETWORK}
          gateway: ${NETWORK_GATEWAY}